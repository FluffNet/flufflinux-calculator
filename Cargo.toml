[package]
name = "flufflinux-calculator"
version = "2026.9.0-3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A Rust and Qt calculator for Fluff Linux"

[package.metadata.flufflinux]
release = "2026.09-3"

[dependencies]
cxx = "1"
cxx-qt = { version = "0.9", default-features = false }
cxx-qt-lib = { version = "0.9", default-features = false, features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
rug = { version = "1.30", default-features = false, features = ["integer", "float", "complex", "std"] }
gmp-mpfr-sys = { version = "1.7", default-features = false, features = ["mpfr", "mpc", "use-system-libs"] }

[build-dependencies]
cxx-qt-build = { version = "0.9", default-features = false }
