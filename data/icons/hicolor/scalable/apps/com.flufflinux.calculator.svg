<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <style type="text/css" id="current-color-scheme">
      .ColorScheme-Text { color: #232629; }
      .ColorScheme-Background { color: #eff0f1; }
      .ColorScheme-Accent { color: #820101; }
    </style>
    <linearGradient id="body-shade" x1="0" y1="4" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect x="8" y="4" width="32" height="40" class="ColorScheme-Text" style="fill:currentColor"/>
  <rect x="8" y="4" width="32" height="40" fill="url(#body-shade)"/>
  <rect x="8" y="43" width="32" height="1" class="ColorScheme-Background"
        style="fill:currentColor" opacity="0.42"/>
  <rect x="10" y="6" width="28" height="9" class="ColorScheme-Background"
        style="fill:currentColor"/>

  <g class="ColorScheme-Background" style="fill:currentColor" opacity="0.92">
    <rect x="10" y="18" width="5" height="4.5"/>
    <rect x="16.5" y="18" width="5" height="4.5"/>
    <rect x="23" y="18" width="5" height="4.5"/>

    <rect x="10" y="23.75" width="5" height="4.5"/>
    <rect x="16.5" y="23.75" width="5" height="4.5"/>
    <rect x="23" y="23.75" width="5" height="4.5"/>

    <rect x="10" y="29.5" width="5" height="4.5"/>
    <rect x="16.5" y="29.5" width="5" height="4.5"/>
    <rect x="23" y="29.5" width="5" height="4.5"/>

    <rect x="10" y="35.25" width="5" height="4.5"/>
    <rect x="16.5" y="35.25" width="5" height="4.5"/>
    <rect x="23" y="35.25" width="5" height="4.5"/>
  </g>

  <rect x="30.5" y="18" width="7.5" height="21.75"
        class="ColorScheme-Accent" style="fill:currentColor"/>
</svg>
